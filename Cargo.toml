[package]
name = "perch"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Tiny native Wayland image pinning daemon"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp", "tiff", "gif", "bmp", "ico", "pnm", "qoi", "tga", "hdr"] }
resvg = "0.48.1"
tiff = "0.11.3"
fast_image_resize = { version = "6", features = ["only_u8x4"] }
memmap2 = "0.9"
nix = { version = "0.30", features = ["fs", "poll", "socket", "user"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
spng = { version = "0.2.0-alpha.3", features = ["zlib-ng"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
